<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F2F2F7">
    <title>澳洲NS微岩石材料用量程序</title>
    <!-- 引入 Tailwind CSS 进行快速样式开发 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* iOS 专属字体优化 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #F2F2F7;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 卡片玻璃拟态效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 输入框聚焦效果 */
        .ios-input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        /* 动画效果 */
        .fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 品牌色 */
        .text-brand { color: #1c1c1e; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="pt-[max(env(safe-area-inset-top),20px)] pb-4 px-6 bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200/50">
        <div class="flex flex-col items-center justify-center space-y-3">
            <!-- LOGO 区域 -->
            <div class="h-12 w-full flex items-center justify-center overflow-hidden">
                <img src="https://files.oaiusercontent.com/file-2u2K5v7g4hWl7qV1R6Z491?se=2025-11-28T17%3A13%3A23Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D%25E6%2588%25AA%25E5%25B1%258F2025-11-28%2520%25E4%25B8%258A%25E5%258D%258812.13.36.jpg&sig=7G5qN5U3G/2uD0V5vB38Z4Kj8%2BG6yV2L%2BR%2BSZ4q7L%2Bw%3D" 
                     alt="Natural Surface ROCCA Logo" 
                     class="h-full object-contain filter contrast-125"
                     onerror="this.style.display='none'; document.getElementById('text-logo').style.display='block'">
                <h1 id="text-logo" style="display:none" class="text-xl font-bold tracking-tight text-brand">Natural Surface</h1>
            </div>
            <p class="text-xs font-medium text-gray-400 tracking-widest uppercase">材料用量计算程序</p>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="flex-1 px-5 py-6 space-y-6 overflow-y-auto no-scrollbar">

        <!-- 1. 选择工序 -->
        <section class="fade-in-up" style="animation-delay: 0.1s;">
            <label class="block text-sm font-semibold text-gray-500 mb-2 ml-1">施工工序</label>
            <div class="relative">
                <select id="processSelect" onchange="calculate()" class="w-full appearance-none bg-white rounded-2xl py-4 pl-4 pr-10 text-lg font-medium text-gray-900 shadow-sm border border-gray-100 focus:ring-2 focus:ring-black/5 transition-all outline-none">
                    <option value="" disabled selected>请选择工序类型</option>
                    <option value="ground_base">地面底层 (MR01)</option>
                    <option value="ground_face">地面面层 (MR02)</option>
                    <option value="wall_face">墙面面层 (MR02)</option>
                    <option value="sealer">封孔剂 / 底漆 (SR)</option>
                    <option value="protection">罩面保护层 (T系列)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <i data-lucide="chevron-down" class="w-5 h-5"></i>
                </div>
            </div>
        </section>

        <!-- 2. 输入面积 -->
        <section class="fade-in-up" style="animation-delay: 0.2s;">
            <label class="block text-sm font-semibold text-gray-500 mb-2 ml-1">施工面积 (m²)</label>
            <div class="relative">
                <input type="number" id="areaInput" placeholder="0" inputmode="decimal" oninput="calculate()" 
                       class="ios-input w-full bg-white rounded-2xl py-4 pl-4 pr-12 text-3xl font-bold text-gray-900 shadow-sm border border-gray-100 placeholder-gray-200 transition-all">
                <div class="absolute inset-y-0 right-0 flex items-center px-5 pointer-events-none">
                    <span class="text-gray-400 font-medium">m²</span>
                </div>
            </div>
        </section>

        <!-- 3. 计算结果 (默认隐藏) -->
        <div id="resultContainer" class="hidden space-y-6 fade-in-up" style="animation-delay: 0.3s;">

            <!-- 主要材料清单 -->
            <section>
                <div class="flex items-center justify-between mb-3 ml-1">
                    <label class="text-sm font-semibold text-gray-500">材料配比清单</label>
                    <span class="text-xs bg-black text-white px-2 py-1 rounded-full" id="ratioLabel">标准比例</span>
                </div>

                <div class="glass-card rounded-2xl overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-100 bg-gray-50/50">
                                <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase">材料名称</th>
                                <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase text-right">计算用量</th>
                                <th class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase text-right">比例</th>
                            </tr>
                        </thead>
                        <tbody id="materialTableBody" class="text-sm">
                            <!-- JS 动态填充 -->
                        </tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-400 mt-2 ml-2">* 计算基于单层施工用量，如需多层请自行累加。</p>
            </section>

            <!-- 搅拌与注意事项 -->
            <div class="grid grid-cols-1 gap-4">
                <!-- 搅拌方式 -->
                <div class="glass-card p-5 rounded-2xl">
                    <div class="flex items-center space-x-2 mb-3 text-orange-500">
                        <i data-lucide="shuffle" class="w-5 h-5"></i>
                        <h3 class="font-bold text-gray-900">搅拌方式</h3>
                    </div>
                    <p id="mixMethod" class="text-sm text-gray-600 leading-relaxed text-justify">
                        <!-- JS 填充 -->
                    </p>
                </div>

                <!-- 注意事项 -->
                <div class="glass-card p-5 rounded-2xl border-l-4 border-red-500">
                    <div class="flex items-center space-x-2 mb-3 text-red-500">
                        <i data-lucide="alert-circle" class="w-5 h-5"></i>
                        <h3 class="font-bold text-gray-900">注意事项</h3>
                    </div>
                    <ul id="noticeList" class="text-sm text-gray-600 space-y-2 list-disc list-inside">
                        <!-- JS 填充 -->
                    </ul>
                </div>
            </div>

        </div>

        <!-- 底部版权 -->
        <div class="h-10"></div>
    </main>

    <!-- 底部固定版权 -->
    <footer class="bg-gray-50 py-4 text-center border-t border-gray-200">
        <p class="text-[10px] text-gray-400">© 2025 Natural Surface. All Rights Reserved.</p>
    </footer>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 数据源定义 (已更新)
        // 计算逻辑：
        // Ground Base MR01: 16kg桶 / 24m2 = ~0.667 kg/m2 (粉料基准)
        // Ground/Wall Face MR02: 16kg桶 / 46m2 = ~0.348 kg/m2 (粉料基准)
        // Sealer (封孔剂): SR01(5kg)+SR02(5kg)=10kg树脂 -> 200m2。
        //                 即 10kg/200m2 = 0.05 kg/m2 (树脂总量)
        // Protection (保护层): 保持原逻辑 (5kg组/80m2)

        const processes = {
            ground_base: {
                name: "地面底层 MR01",
                baseConsumption: 16 / 24, // 16kg桶 / 24平方
                mixMethod: "搅拌机混合搅拌",
                notices: [
                    "搅拌后马上使用",
                    "不建议一桶搅拌，干得比较快，建议每8kg的MR01粉料使用",
                    "如果批挂得比较快可以适当增加",
                    "中途变稠可以加水"
                ],
                materials: [
                    { code: "MR01", name: "MR01粗砂", ratio: 1, isBase: true },
                    { code: "SR01", name: "SR01", ratio: 0.15, formula: "MR01 × 15%" },
                    { code: "SR02", name: "SR02", ratio: 0.15, formula: "MR01 × 15%" },
                    { code: "SR03", name: "树脂C组", ratio: 0.006, formula: "MR01 × 0.6%" },
                    { code: "Water", name: "水", ratio: 0.30, formula: "MR01 × 30%" }
                ]
            },
            ground_face: {
                name: "地面面层 MR02",
                baseConsumption: 16 / 46, // 16kg桶 / 46平方
                mixMethod: "搅拌机混合搅拌",
                notices: [
                    "开始不用加水",
                    "中途变稠可以加水"
                ],
                materials: [
                    { code: "MR02", name: "MR02细砂", ratio: 1, isBase: true },
                    { code: "SR01", name: "SR01", ratio: 0.30, formula: "MR02 × 30%" },
                    { code: "SR02", name: "SR02", ratio: 0.30, formula: "MR02 × 30%" },
                    { code: "Color", name: "色浆", ratio: 0, formula: "根据实际效果加色浆" }
                ]
            },
            wall_face: {
                name: "墙面面层 MR02",
                baseConsumption: 16 / 46, // 16kg桶 / 46平方
                mixMethod: "搅拌机混合搅拌",
                notices: [
                    "开始需要加水",
                    "中途变稠可以加水"
                ],
                materials: [
                    { code: "MR02", name: "MR02细砂", ratio: 1, isBase: true },
                    { code: "SR01", name: "SR01", ratio: 0.15, formula: "MR02 × 15%" },
                    { code: "SR02", name: "SR02", ratio: 0.15, formula: "MR02 × 15%" },
                    { code: "Water", name: "水", ratio: 0.30, formula: "MR02 × 30%" },
                    { code: "Color", name: "色浆", ratio: 0, formula: "根据实际效果加色浆" }
                ]
            },
            sealer: {
                name: "封孔剂/底漆",
                baseConsumption: 0.05, // (SR01 5kg + SR02 5kg) / 200m2 = 0.05 kg/m2 (树脂总量)
                isTotalMix: true, 
                mixMethod: "用搅拌转或者棍子搅拌",
                notices: [
                    "SR01(5kg) + SR02(5kg) + 水(10kg) 可施工约 200m²",
                    "一定要用短毛滚筒刷 (4-6mm)",
                    "否则会出问题"
                ],
                materials: [
                    { code: "SR01", name: "SR01", share: 0.5, formula: "与SR02 1:1" },
                    { code: "SR02", name: "SR02", share: 0.5, formula: "与SR01 1:1" },
                    { code: "Water", name: "水", share: 1, formula: "SR01+SR02总和" } 
                ]
            },
            protection: {
                name: "罩面保护层",
                baseConsumption: 0.0625, // 保持原逻辑 T01+T02
                isTotalMix: true,
                mixMethod: "1、先加入T01+T02【不加水】，顺时针搅拌1分钟，逆时针搅拌1分钟。<br>2、加入水，再搅拌1分钟。<br>3、如果搅拌过快或时间过久有泡沫，则需要等待1-2分钟气泡散去再用。",
                notices: [
                    "搅拌完，一定要在30分钟-2个小时内使用完毕。搅拌完超过2个小时不能用",
                    "一定要用短毛滚筒刷 (4-6mm) 【否则会出问题】",
                    "滚筒，交叉乱刷！【切勿横直竖平刷】"
                ],
                materials: [
                    { code: "T01", name: "T01", share: 0.8, formula: "T01:T02 = 4:1" },
                    { code: "T02", name: "T02", share: 0.2, formula: "T01:T02 = 4:1" },
                    { code: "Water", name: "水", share: 0.1, formula: "T01+T02总和的10%" } 
                ]
            }
        };

        function calculate() {
            const processKey = document.getElementById('processSelect').value;
            const area = parseFloat(document.getElementById('areaInput').value);
            const container = document.getElementById('resultContainer');
            const tbody = document.getElementById('materialTableBody');
            const mixMethodEl = document.getElementById('mixMethod');
            const noticeListEl = document.getElementById('noticeList');

            if (!processKey || !area || area <= 0) {
                container.classList.add('hidden');
                return;
            }

            const data = processes[processKey];
            container.classList.remove('hidden');

            // Populate Text Info
            mixMethodEl.innerHTML = data.mixMethod;
            noticeListEl.innerHTML = data.notices.map(n => `<li>${n}</li>`).join('');

            // Calculate Materials
            tbody.innerHTML = '';

            if (data.isTotalMix) {
                // For Sealer and Protection, baseConsumption is the main mix (A+B) total per m2
                const totalMainMix = area * data.baseConsumption;

                data.materials.forEach(mat => {
                    let amount = 0;
                    if (mat.code === 'Water' && processKey === 'sealer') {
                        amount = totalMainMix * mat.share; 
                    } else if (mat.code === 'Water' && processKey === 'protection') {
                        amount = totalMainMix * 0.10;
                    } else {
                        amount = totalMainMix * mat.share;
                    }

                    addRow(tbody, mat.name, formatWeight(amount), mat.formula);
                });

            } else {
                const baseAmount = area * data.baseConsumption;

                data.materials.forEach(mat => {
                    let amount = 0;
                    if (mat.isBase) {
                        amount = baseAmount;
                    } else if (mat.ratio > 0) {
                        amount = baseAmount * mat.ratio;
                    }

                    const displayAmount = mat.ratio === 0 ? "适量" : formatWeight(amount);
                    addRow(tbody, mat.name, displayAmount, mat.formula);
                });
            }
        }

        function formatWeight(kg) {
            if (kg < 1) {
                return (kg * 1000).toFixed(0) + ' g';
            }
            return kg.toFixed(2) + ' kg';
        }

        function addRow(tbody, name, amount, ratio) {
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-100 hover:bg-gray-50 transition-colors";
            tr.innerHTML = `
                <td class="py-3 px-4 font-medium text-gray-800">${name}</td>
                <td class="py-3 px-4 text-right font-bold text-blue-600">${amount}</td>
                <td class="py-3 px-4 text-right text-gray-400 text-xs">${ratio}</td>
            `;
            tbody.appendChild(tr);
        }
    </script>
</body>
</html>
